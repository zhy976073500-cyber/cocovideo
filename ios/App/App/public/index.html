<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>CocoVideo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --line: rgba(0, 0, 0, 0.08);
        --card: rgba(255, 255, 255, 0.72);
        --card-solid: #ffffff;
        --track: #e9e9ee;
        --field: #ffffff;
        --seg-on: #ffffff;
        --blue: #0071e3;
        --blue-press: #0060c9;
        --orange: #ff9500;
        --diamond: #0a84ff;
        --red: #ff3b30;
        --sheet: rgba(250, 250, 252, 0.85);
        --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.05);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --ink: #f5f5f7;
          --ink-2: #a1a1a6;
          --line: rgba(255, 255, 255, 0.13);
          --card: rgba(28, 28, 30, 0.72);
          --card-solid: #1c1c1e;
          --track: #2c2c2e;
          --field: #1c1c1e;
          --seg-on: #48484a;
          --sheet: rgba(20, 20, 22, 0.88);
          --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
      body { overflow: hidden; overscroll-behavior: none; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }
      button { font: inherit; color: inherit; }
      button:active { transform: scale(0.97); }
      button { transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease, opacity 150ms ease; }
      button:disabled { transform: none; }
      svg.ic { width: 20px; height: 20px; flex: none; }

      .app { max-width: 440px; margin: 0 auto; padding: 8px 16px 10px; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

      /* ---------- 顶栏 ---------- */
      .topbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 8px; }
      .state-pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 600; color: var(--ink-2);
        background: var(--card); border: 1px solid var(--line); border-radius: 999px;
        padding: 6px 11px; backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
      }
      .state-pill svg.ic { width: 13px; height: 13px; }
      /* ---------- 状态切换（v2） ---------- */
      .state-seg { display: flex; background: var(--track); border-radius: 999px; padding: 3px; gap: 3px; flex: none; }
      .state-seg button { border: none; background: transparent; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
      .state-seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16); }
      .state-bar { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 0 2px 10px; }
      .state-bar .sb-hint { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
      .sb-actions { display: flex; gap: 8px; }
      /* 画布内悬浮的过渡预览按钮 */
      .pv-overlay {
        position: absolute; left: 0; right: 0; bottom: 38px; z-index: 5;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
        padding: 0 8px; pointer-events: none;
      }
      .pv-overlay .pv-btn {
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(14, 14, 24, 0.55); color: #fff;
        backdrop-filter: blur(10px) saturate(1.5); -webkit-backdrop-filter: blur(10px) saturate(1.5);
        padding: 5px 8px; font-size: 10.5px; gap: 0; white-space: nowrap;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .pv-overlay .pv-btn svg.ic { display: none; }
      .pv-overlay .pv-btn:disabled { color: rgba(255, 255, 255, 0.45); opacity: 1; }
      .state-bar .sb-hint b { color: var(--ink); }
      .sb-btn { border: 1px solid var(--line); background: var(--card-solid); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; flex: none; }
      .sb-btn:disabled { color: var(--ink-2); cursor: default; opacity: 0.55; }
      /* ---------- 过渡预览 ---------- */
      .preview-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 0 2px 10px; }
      .preview-row .pv-lab { font-size: 12px; font-weight: 700; color: var(--ink-2); flex: none; }
      .pv-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); }
      .pv-btn svg.ic { width: 13px; height: 13px; }
      .pv-btn:disabled { color: var(--ink-2); cursor: default; opacity: 0.55; }
      .top-export {
        display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
        background: var(--card); color: var(--blue);
        font-size: 13.5px; font-weight: 700; padding: 7px 14px;
        backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
      }
      .top-export svg.ic { width: 15px; height: 15px; }

      /* ---------- 画布 ---------- */
      .mid { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
      .side { display: contents; }
      .stage-wrap { display: flex; justify-content: center; align-items: center; flex: 1 1 auto; min-height: 0; }
      /* 抽屉展开：左右分栏，画布在左按高度撑大，走带与时间线在右列完整露出 */
      .app.sheet-open .mid { flex-direction: row; align-items: stretch; gap: 10px; }
      .app.sheet-open .stage-wrap { flex: 0 1 auto; min-width: 0; }
      .app.sheet-open .side { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; min-height: 0; }
      .app.sheet-open .transport { flex-wrap: wrap; row-gap: 2px; }
      .app.sheet-open .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .app.sheet-open .mtl { flex: 1 1 auto; min-height: 42px; }
      .canvas {
        position: relative; flex: none;
        width: min(100%, 324px);
        aspect-ratio: 390 / 844;
        border-radius: 28px;
        overflow: hidden;
        background: #141a33;
        box-shadow: 0 22px 55px rgba(10, 12, 40, 0.28), 0 2px 10px rgba(0, 0, 0, 0.14);
        transition: width 240ms var(--ease-out);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .canvas .bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
      .bg-empty {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
        align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.75);
        font-size: 13.5px; font-weight: 600; text-align: center; padding: 0 30px; pointer-events: none;
      }
      .bg-empty svg.ic { width: 34px; height: 34px; opacity: 0.7; }
      .fl-layer { position: absolute; left: 0; top: 0; cursor: grab; border-radius: 6px; }
      .fl-layer:active { cursor: grabbing; }
      .fl-layer img { width: 100%; height: 100%; display: block; pointer-events: none; }
      .fl-layer.selected { outline: 1.5px solid var(--blue); outline-offset: 3px; }
      .fl-layer .anchor-dot { position: absolute; width: 11px; height: 11px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); display: none; pointer-events: none; z-index: 3; }
      .fl-layer.selected .anchor-dot { display: block; }
      .input-wrap input.scrub { cursor: ew-resize; touch-action: none; }
      .canvas-hint {
        position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
        color: rgba(255, 255, 255, 0.85); font-size: 12px; font-weight: 600;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45); pointer-events: none; padding: 0 24px;
      }
      .time-badge {
        position: absolute; left: 10px; bottom: 10px; pointer-events: none;
        background: rgba(16, 16, 26, 0.5); color: #fff;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
        padding: 4px 9px; border-radius: 999px;
      }

      /* ---------- 走带 ---------- */
      .transport { display: flex; align-items: center; gap: 12px; padding: 10px 2px 10px; }
      .play-btn {
        width: 46px; height: 46px; border: none; border-radius: 50%; cursor: pointer;
        background: var(--blue); color: #fff; display: grid; place-items: center; flex: none;
        box-shadow: 0 6px 16px rgba(0, 113, 227, 0.35);
      }
      .play-btn:disabled { background: var(--track); color: var(--ink-2); box-shadow: none; }
      .play-btn svg.ic { width: 22px; height: 22px; }
      .transport .meta { flex: 1; min-width: 0; }
      .time-read { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .pos-read { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kf-btn {
        display: inline-flex; align-items: center; gap: 6px; flex: none;
        border: none; border-radius: 999px; cursor: pointer;
        background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; padding: 11px 15px;
        box-shadow: 0 6px 16px rgba(0, 113, 227, 0.3);
      }
      .kf-btn:disabled { background: var(--track); color: var(--ink-2); box-shadow: none; }
      .kf-btn svg.ic { width: 15px; height: 15px; }

      /* ---------- 卡片 / 时间轴 ---------- */
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 20px;
        padding: 14px; box-shadow: var(--shadow-card);
        backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
      }
      .track { position: relative; height: 46px; background: var(--track); border-radius: 12px; touch-action: none; }
      .track .playhead { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--red); border-radius: 2px; pointer-events: none; }
      /* ---------- 多轨道时间线 ---------- */
      .mtl { position: relative; display: flex; flex-direction: column; gap: 8px; touch-action: none; }
      .mtl .playhead { position: absolute; top: -3px; bottom: -3px; width: 2.5px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; z-index: 6; }
      .mtl-row { display: flex; align-items: stretch; gap: 8px; min-height: 42px; }
      .mtl-row.dragging { opacity: 0.55; }
      .mtl-eye { flex: none; width: 46px; border: none; background: var(--track); border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); padding: 0; }
      .mtl-eye svg.ic { width: 21px; height: 21px; }
      .mtl-eye.off { color: var(--ink-2); opacity: 0.55; }
      .mtl-strip { position: relative; flex: 1; min-width: 0; height: 42px; background-color: var(--track); background-repeat: repeat-x; background-size: auto 100%; background-position: 0 0; border-radius: 10px; overflow: hidden; cursor: ew-resize; }
      .mtl-row.is-hidden .mtl-strip { opacity: 0.35; }
      .mtl-strip .diamond { z-index: 3; }
      .mtl-handle { flex: none; width: 34px; border: none; background: none; display: grid; place-items: center; cursor: grab; color: var(--ink-2); padding: 0; touch-action: none; }
      .mtl-handle:active { cursor: grabbing; }
      .mtl-handle svg.ic { width: 20px; height: 20px; }
      .mtl-handle.disabled { opacity: 0.3; cursor: default; }
      .mtl-empty { font-size: 12.5px; color: var(--ink-2); padding: 8px 2px; }
      .app.sheet-open .mtl-eye { width: 36px; }
      .app.sheet-open .mtl-handle { width: 26px; }
      .diamond { position: absolute; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; padding: 0; border: none; background: none; cursor: pointer; display: grid; place-items: center; }
      .diamond svg { width: 14px; height: 14px; fill: var(--diamond); display: block; }
      .diamond.sel svg { width: 19px; height: 19px; fill: var(--orange); }
      .duration-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
      .duration-row .lab { font-size: 12.5px; font-weight: 700; color: var(--ink-2); flex: none; }
      .duration-row .val { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; width: 42px; text-align: right; }
      input[type="range"] { flex: 1; accent-color: var(--blue); height: 28px; margin: 0; min-width: 0; }
      .kf-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
      .kf-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
      .kf-detail-head .t { font-size: 13px; font-weight: 700; }
      .del-btn { display: inline-flex; align-items: center; gap: 5px; border: none; background: none; color: var(--red); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 4px 2px; }
      .del-btn svg.ic { width: 14px; height: 14px; }
      .seg-label { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
      .seg { display: flex; background: var(--track); border-radius: 11px; padding: 3px; gap: 3px; }
      .seg button { flex: 1; border: none; background: transparent; padding: 7px 0; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; cursor: pointer; }
      .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14); }
      .hint { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
      .kf-detail .hint { margin-top: 2px; }

      /* ---------- 底部抽屉 ---------- */
      .sheet {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 30;
        width: min(440px, 100%);
        background: var(--sheet); border-top: 1px solid var(--line);
        border-radius: 22px 22px 0 0; box-shadow: 0 -14px 44px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(26px) saturate(1.7); -webkit-backdrop-filter: blur(26px) saturate(1.7);
        padding-bottom: env(safe-area-inset-bottom);
        transition: transform 240ms var(--ease-out);
      }
      .sheet-head {
        position: relative; display: flex; align-items: center; justify-content: center;
        min-height: 32px; padding: 2px 0 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      .sheet-head:active { cursor: grabbing; }
      .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--ink-2); opacity: 0.45; }
      .sheet-toggle {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        display: inline-flex; align-items: center; gap: 3px;
        border: 1px solid var(--line); background: var(--card-solid); border-radius: 999px;
        padding: 7px 12px; min-height: 34px;
        font-size: 12.5px; font-weight: 700; color: var(--ink-2); cursor: pointer;
      }
      .sheet-toggle:active { transform: translateY(-50%) scale(0.97); }
      .sheet-toggle svg.ic { width: 14px; height: 14px; transition: transform 200ms var(--ease-out); }
      .sheet:not(.open) .sheet-toggle svg.ic { transform: rotate(180deg); }
      .tabs { display: flex; gap: 4px; padding: 3px 12px 6px; }
      .tabs button { flex: 1; border: none; background: transparent; border-radius: 999px; padding: 6px 0; font-size: 13.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
      .tabs button.on { background: var(--ink); color: var(--bg); }
      .sheet-body { display: none; }
      .sheet.open .sheet-body { display: block; max-height: 250px; max-height: 32dvh; overflow-y: auto; overscroll-behavior: contain; animation: sheet-in 260ms var(--ease-out); }
      @keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .panel { display: none; padding: 0 14px 12px; }
      .panel.on { display: block; }
      .panel input[type="range"] { height: 24px; }

      /* 图层面板 */
      .layer-row { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 13px; border: 1px solid transparent; cursor: pointer; }
      .layer-row + .layer-row { margin-top: 2px; }
      .layer-row.on { background: var(--card-solid); border-color: var(--line); box-shadow: var(--shadow-card); }
      .thumb { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; background: var(--track); flex: none; }
      .thumb.contain { object-fit: contain; padding: 4px; }
      .layer-row .lmeta { flex: 1; min-width: 0; }
      .layer-row .lname { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .layer-row .lsub { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      .mini-btn { border: 1px solid var(--line); background: var(--card-solid); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; flex: none; }
      .mini-btn.danger { color: var(--red); }
      .add-btn {
        width: 100%; margin-top: 8px; padding: 9px 0; cursor: pointer;
        border: 1.5px dashed var(--line); border-radius: 15px; background: none;
        color: var(--blue); font-size: 14px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; gap: 7px;
      }
      .add-btn:disabled { color: var(--ink-2); cursor: default; }
      .add-btn svg.ic { width: 16px; height: 16px; }
      .panel .hint { margin-top: 10px; }

      /* 变换面板 */
      .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 3px; }
      .input-wrap { display: flex; align-items: center; gap: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 11px; padding: 0 11px; }
      .input-wrap input { width: 100%; min-width: 0; border: none; background: none; outline: none; padding: 6px 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
      .input-wrap .unit { font-size: 12px; color: var(--ink-2); flex: none; }
      .slider-field { margin-top: 9px; }
      .slider-field .row { display: flex; align-items: center; gap: 10px; }
      .slider-field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 0; }
      .slider-field .input-wrap { width: 86px; flex: none; }
      .transform-off { padding: 8px 0 2px; }

      /* 导出面板 */
      .name-input { width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 12px; padding: 9px 12px; font-size: 16px; font-weight: 600; outline: none; }
      .name-input:focus { border-color: var(--blue); }
      .export-btn {
        width: 100%; margin-top: 9px; border: none; border-radius: 14px; cursor: pointer;
        background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; padding: 11px 0;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 8px 20px rgba(0, 113, 227, 0.32);
      }
      .export-btn:active { background: var(--blue-press); }
      .export-btn:disabled { background: var(--track); color: var(--ink-2); box-shadow: none; }
      .export-btn svg.ic { width: 18px; height: 18px; }
      .export-status { margin-top: 8px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
      .export-status:empty { margin-top: 0; }
      .export-status.ok { color: #1a7f37; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .export-status.ok { color: #3fb950; } }

      /* ---------- 变换页（面板拖上来展开后的样子） ---------- */
      .tf-page { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--ink); }
      .tf-page[hidden] { display: none; }
      .tf-inner { position: relative; max-width: 440px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
      .tf-head { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 44px; flex: none; }
      .tf-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; pointer-events: none; }
      .tf-hbtn { width: 42px; height: 42px; border: 1px solid var(--line); background: var(--card-solid); border-radius: 13px; display: grid; place-items: center; cursor: pointer; color: var(--ink); padding: 0; }
      .tf-hbtn svg.ic { width: 20px; height: 20px; }
      .tf-head-right { display: flex; gap: 8px; }
      .tf-stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 0; }
      .tf-pop { position: absolute; top: 54px; right: 0; width: 268px; z-index: 5; background: var(--card-solid); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18); padding: 12px; }
      .tf-pop[hidden] { display: none; }
      .tf-pop .state-seg { width: 100%; }
      .tf-pop .state-seg button { flex: 1; }
      .tf-pop-row { display: flex; gap: 8px; margin-top: 10px; }
      .tf-pop-row .sb-btn { flex: 1; }
      .tf-transport { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 6px 0 2px; flex: none; }
      .tf-tgroup { display: flex; align-items: center; gap: 4px; }

      .tf-strip { position: relative; height: 36px; border-radius: 7px; background-color: var(--track); background-repeat: repeat-x; background-size: auto 100%; background-position: 0 0; overflow: hidden; margin-top: 2px; }

      .tf-rlabel { flex: none; width: 64px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: visible; }
      .tf-rtrack { position: relative; flex: 1; min-width: 0; height: 42px; overflow: hidden; touch-action: none; cursor: ew-resize; }
      .tf-rtick-min, .tf-rtick-maj { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); background-repeat: repeat-x; pointer-events: none; }

    <script>
    "use strict";
    /* ================= 基础常量与工具 ================= */
    var CW = 390, CH = 844;
    var EASINGS = {
      linear:        { label: "线性",     pts: [0, 0, 1, 1] },
      easeIn:        { label: "缓入",     pts: [0.42, 0, 1, 1] },
      easeOut:       { label: "缓出",     pts: [0, 0, 0.58, 1] },
      easeInEaseOut: { label: "缓入缓出", pts: [0.42, 0, 0.58, 1] }
    };
    var EASING_ORDER = ["linear", "easeIn", "easeOut", "easeInEaseOut"];

    function fmt(v) {
      if (typeof v !== "number" || !isFinite(v)) return "0";
      if (Math.round(v) === v && Math.abs(v) < 1e15) return String(Math.round(v));
      var s = v.toFixed(3);
      while (s.slice(-1) === "0") s = s.slice(0, -1);
      if (s.slice(-1) === ".") s = s.slice(0, -1);
      return s === "-0" ? "0" : s;
    }
    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
    var _uid = 1;
    function nid() { return "n" + (_uid++); }
    function el(id) { return document.getElementById(id); }
    function escXML(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
    }

    var tfPageEl = el("tfPage"), tfStageEl = el("tfStage"), tfPopEl = el("tfPop");

      y:     { label: "Y",       min: 0,    max: 844,  ppu: 3, dragPpu: 6, minDiv: 2 },
      scale: { label: "大小",    min: 10,   max: 300,  ppu: 3 },

      switch (ch) {
        case "x": return act.live.x;
        case "y": return act.live.y;

          '<input class="tf-rval" type="text" inputmode="decimal" aria-label="' + meta.label + '数值" />';

          ch: ch, meta: meta,
          maj: row.querySelector(".tf-rtick-maj"),
          min: row.querySelector(".tf-rtick-min"),
          track: row.querySelector(".tf-rtrack"),
          val: row.querySelector(".tf-rval")

        refs.maj.style.backgroundSize = (meta.ppu * 5) + "px 100%";
        refs.min.style.backgroundSize = (meta.ppu / (meta.minDiv || 1)) + "px 100%";

          var v = parseFloat(refs.val.value);

    function attachTfRulerDrag(refs) {

    function jumpKf(dir) {
      var act = activeLayer();

      var times = act.keyframes.map(function (f) { return f.time; });

      if (dir < 0) {
        for (i = times.length - 1; i >= 0; i--) if (times[i] < state.playhead - 0.001) { target = times[i]; break; }
        if (target == null) target = times[times.length - 1];
      } else {
        for (i = 0; i < times.length; i++) if (times[i] > state.playhead + 0.001) { target = times[i]; break; }
        if (target == null) target = times[0];

    var fileTarget = { kind: "add" };

        if (target.kind === "replace") {
          var l = layerById(target.id);
          if (l) {
            var nl = makeLayer(url, img, l.name);
            l.src = url; l.img = img; l.pixelW = nl.pixelW; l.pixelH = nl.pixelH;
            l.baseW = nl.baseW; l.baseH = nl.baseH;

          if (state.layers.length >= 3) return;
          var base = fname.replace(/\.[^.]+$/, "") || "浮动图";

    /* ================= .tendies 导出 =================
       结构逐项对齐 CocoWall 的 TendiesExporter.swift：
       ZIP(STORE) + PosterBoard 描述符树 + Background/Floating .ca。

    var SCREEN_CLASS = "390w-844h@3x~iphone";

      var longest = Math.max(iw, ih), s = longest > 1200 ? 1200 / longest : 1;
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(iw * s)); c.height = Math.max(1, Math.round(ih * s));

    }

      return out || "Keyframe";

    function setExportStatus(msg, ok) {

    el("exportBtn").addEventListener("click", function () {
      if (exporting) return;
      if (!state.bg) { setExportStatus("先在「图层」里选一张背景图。", false); setTab("layers"); return; }
      if (!state.layers.length) { setExportStatus("至少添加一个浮动层再导出。", false); setTab("layers"); return; }
      exporting = true;
      el("exportBtn").disabled = true;
      el("exportBtnText").textContent = "正在生成…";
      var name = (el("exportName").value || "").trim() || "我的壁纸";
      var idNum = Date.now() % 900000 + 10000;
      if (idNum === 9901) idNum += 1;
      var identifier = String(idNum);
      var uuid = uuidv4();
      var wpDir = identifier + "." + FAMILY + "-" + SCREEN_CLASS + ".wallpaper";
      var bgCA = identifier + "." + FAMILY + "_Background-" + SCREEN_CLASS + ".ca";
      var flCAs = state.layers.map(function (l, i) {
        return identifier + "." + FAMILY + (i === 0 ? "_Floating" : "_Floating" + (i + 1)) + "-" + SCREEN_CLASS + ".ca";
      });
      var base = "descriptors/" + uuid;
      var contents = base + "/versions/1/contents";
      var wp = contents + "/" + wpDir;
      var enc = new TextEncoder();
      var jobs = [renderBackgroundPNG(state.bg.img)];
      state.layers.forEach(function (l) { jobs.push(renderFloatingPNG(l.img)); });
      Promise.all(jobs).then(function (pngs) {
        var entries = [
          { name: base + "/com.apple.posterkit.provider.descriptor.identifier", data: enc.encode(identifier) },
          { name: base + "/com.apple.posterkit.role.identifier", data: enc.encode("PRPosterRoleLockScreen") },
          { name: base + "/providerInfo.plist", data: providerInfoData() },
          { name: contents + "/com.apple.posterkit.provider.contents.userInfo", data: enc.encode(userInfoPlist(wpDir, identifier)) },
          { name: wp + "/Wallpaper.plist", data: enc.encode(wallpaperPlist(name, identifier, bgCA, flCAs)) },
          { name: wp + "/" + bgCA + "/index.xml", data: enc.encode(INDEX_XML) },
          { name: wp + "/" + bgCA + "/assetManifest.caml", data: enc.encode(ASSET_MANIFEST) },
          { name: wp + "/" + bgCA + "/main.caml", data: enc.encode(backgroundCAML()) },
          { name: wp + "/" + bgCA + "/assets/background.png", data: new Uint8Array(pngs[0]) }
        ];
        state.layers.forEach(function (l, i) {
          var dir = wp + "/" + flCAs[i];
          entries.push({ name: dir + "/index.xml", data: enc.encode(INDEX_XML) });
          entries.push({ name: dir + "/assetManifest.caml", data: enc.encode(ASSET_MANIFEST) });
          entries.push({ name: dir + "/main.caml", data: enc.encode(floatingCAML(l, i)) });
          entries.push({ name: dir + "/assets/floating.png", data: new Uint8Array(pngs[i + 1]) });
        });
        var zip = zipStore(entries);
        var fileName = sanitizedFileBase(name) + "-" + identifier + ".tendies";
        var blob = new Blob([zip], { type: "application/octet-stream" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        setExportStatus("已生成 " + fileName + "。到文件 App 里找到它，导入 CocoWall 壁纸库，勾选后就能刷入。", true);
      }).catch(function () {
        setExportStatus("生成失败，换一张图片再试。", false);
      }).then(function () {
        exporting = false;
        el("exportBtn").disabled = false;
        el("exportBtnText").textContent = "生成 .tendies 并下载";
      });
    });
